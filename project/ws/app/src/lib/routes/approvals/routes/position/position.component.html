<mat-card id="profdetails" class="flex flex-1 flex-column margin-left-m margin-bottom-m margin-right-m ws-mat-accent-border">
  <div class="flex-custom">
    <mat-card-content class="margin-top-m margin-bottom-m margin-left-m margin-right-m">
      <span class="mat-subheading-1 flex-4 mobile-margin appr-section-heading">
        Professional details
      </span>
      <div class="margin-top-xl new-mobile" *ngIf="professionalDetails">
        <div class="flex flex-wrap mobile-break">
          <div class="w-full profile-cols-full bg-grey">
            <ng-container>
              <mat-grid-list cols="1" rowHeight="100px">
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label">Type of organisation</label>
                  <mat-radio-group [value]="professionalDetails.organisationType" [disabled]="true" aria-label="Select an option">
                    <mat-radio-button value="Government" class="radio-btn">Government organisation</mat-radio-button>
                    <mat-radio-button value="Non-Government" class="radio-btn">Non-government organisation
                    </mat-radio-button>
                  </mat-radio-group>
                </mat-grid-tile>

                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="department-name-input">MDO</label>
                  <input id="department-name-input" type="text" [disabled]="true" class="appr-text-field" [value]="employmentDetails.departmentName">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input">Industry</label>
                  <input id="industry-input" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="designation-input">Designation</label>
                  <input id="designation-input" type="text" [disabled]="true" [value]="professionalDetails.designation ? professionalDetails.designation : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="location-input">Location</label>
                  <input id="location-input" type="text" [disabled]="true" [value]="professionalDetails.location ? professionalDetails.location : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="description-input">Description</label>
                  <textarea id="description-input" [disabled]="true" rows="3" [value]="professionalDetails.description ? professionalDetails.description : ''"
                    class="appr-text-field"></textarea>
                </mat-grid-tile>
              </mat-grid-list>

              <mat-grid-list cols="1" rowHeight="50px" class="margin-top-xl">
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <span class="appr-text-label middle-heading">Other details for government employess (If
                    applicable)</span>
                </mat-grid-tile>
              </mat-grid-list>

              <mat-grid-list cols="2" rowHeight="100px">
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-2">Pay band (grade pay)</label>
                  <input id="industry-input-2" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-3">Service</label>
                  <input id="industry-input-3" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-4">Cadre</label>
                  <input id="industry-input-4" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-5">Allotment year of service</label>
                  <input id="industry-input-5" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="doj-input">Date of joining</label>
                  <input id="doj-input" type="text" [disabled]="true" [value]="professionalDetails.doj ? professionalDetails.doj : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-6">Civil list number</label>
                  <input id="industry-input-6" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="1" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-7">Emplyee code</label>
                  <input id="industry-input-7" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="location-input-2">Location</label>
                  <input id="location-input-2" type="text" [disabled]="true" [value]="professionalDetails.location ? professionalDetails.location : ''"
                    class="appr-text-field">
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="complete-postal-address-input">Official postal address</label>
                  <textarea id="complete-postal-address-input" [disabled]="true" rows="3" [value]="professionalDetails.completePostalAddress ? professionalDetails.completePostalAddress : ''"
                    class="appr-text-field"></textarea>
                </mat-grid-tile>
                <mat-grid-tile [colspan]="2" [rowspan]="1" class="input-wrapper">
                  <label class="appr-text-label" for="industry-input-8">Pin code</label>
                  <input id="industry-input-8" type="text" [disabled]="true" [value]="professionalDetails.industry ? professionalDetails.industry : ''"
                    class="appr-text-field">
                </mat-grid-tile>
              </mat-grid-list>
            </ng-container>
          </div>
        </div>
      </div>
    </mat-card-content>
  </div>
</mat-card>
