<div class="header-container">
  <div>
    <button mat-stroked-button routerLink="/frac/dashboard" class="home-chip icon blue">
      <mat-icon class="home-icon">home</mat-icon>
      Home
    </button>
  </div>
  <div>

    <!-- Save Button -->
    <button mat-stroked-button color="primary" class="save-btn" (click)="onSaveClicked()" [disabled]="!isEditing">
      <span style="color: white;">Save</span>
    </button>
  </div>
</div>

    </button>

  </div>

  <div class="sub-header">
    <span>Upload Competency File (CSV or XLSX)</span>

  </div>

      <div class="search-box">
        <input matInput type="text" placeholder="Search by name, code" [(ngModel)]="searchTerm"
          (input)="onSearchTermChange()" (keydown.enter)="onSearch()" />
        <button mat-icon-button matSuffix class="icon-btn" (click)="onSearch()">
          <mat-icon>search</mat-icon>
        </button>
      </div>

      <div class="language-dropdown" (click)="toggleDropdown()">
        <div class="dropdown-main">
          <div class="label-container">
            <div class="label">Language</div>
            <div class="selected">{{ selectedLanguage }}</div>
          </div>
          <div class="icon">
            <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
          </div>
        </div>

        <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
          <div class="dropdown-item" *ngFor="let lang of languages" (click)="selectLanguage(lang, $event)">
            {{ lang }}
          </div>
        </div>
      </div>
    </div>
    <div class="right-tools">

      <div class="button-group">
        <!-- Remove Button (Red Outline + Icon) -->
        <button mat-stroked-button class="app-btn icon red" (click)="onRemoveClicked()"
          [disabled]="!selectedRows.length">
          <mat-icon>delete</mat-icon>
          Remove
        </button>
        <!-- Edit Button (Blue Outline + Icon) -->
        <button mat-stroked-button class="app-btn icon blue" (click)="onEditClicked()"
          [disabled]="!selectedRows.length">
          <mat-icon>edit</mat-icon>
          Edit
        </button>

        <!-- Secondary Button -->
        <button mat-stroked-button class="app-btn secondary" (click)="onDownloadTemplate()">
          Download sample
        </button>
        <!-- Primary Button -->
        <button type="button" (click)="openUploadPopup()" mat-button class="app-btn primary">
          Upload File
        </button>
      </div>
    </div>
  </div>

  <!-- ✅ Reusable Table -->
  <app-frac-table [columns]="tableConfig.columns" [data]="tableConfig.data" [showCheckbox]="true" [enableSorting]="true"
    [enablePagination]="false" [gridStyle]="'both'" [maxHeight]="'350px'" [isEditing]="isEditing"
    (selectionChange)="onSelectionChange($event)">
  </app-frac-table>
</div>
