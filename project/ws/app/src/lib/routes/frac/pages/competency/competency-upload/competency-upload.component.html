<div class="header-container">
  <button routerLink="/app/home/frac/dashboard" class="home-chip" type="button" aria-label="Go to FRAC dashboard">
    <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/home-frac.svg" alt="home"
      class="home-icon" />
    <span class="home-label">Home</span>
  </button>

  <!-- Save Button - Disabled when no data -->
  <button class="save-btn" (click)="onSaveClicked()" [disabled]="!isEditing || !hasTableData()">
    <span style="color: white;">Save</span>
  </button>
</div>


<div class="upload-container">

  <div class="header">
    <button class="back-button" routerLink="/home" type="button" aria-label="Back to home">
      <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/frac-left-arrow.svg" alt="back"
        class="back-icon" />
    </button>
    <h2>Upload Competency</h2>
  </div>

  <div class="sub-header">
    <span>Upload Competency File (CSV or XLSX)</span>

  </div>

  <div class="toolbar">
    <div class="left-tools">


      <div class="search-box">
        <input matInput type="text" placeholder="Search by name, code" [(ngModel)]="searchTerm"
          (input)="onSearchTermChange()" (keydown.enter)="onSearch()" />
        <button mat-icon-button matSuffix class="icon-btn" (click)="onSearch()">
          <mat-icon>search</mat-icon>
        </button>
      </div>

      <div class="language-dropdown" (click)="toggleDropdown()">
        <div class="dropdown-main">
          <div class="label-container">
            <div class="label">Language</div>
            <div class="selected">{{ selectedLanguage }}</div>
          </div>
          <div class="icon">
            <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
          </div>
        </div>

        <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
          <div class="dropdown-item" *ngFor="let lang of languages" (click)="selectLanguage(lang, $event)">
            {{ lang }}
          </div>
        </div>
      </div>
    </div>
    <div class="right-tools">

      <div class="button-group">
        <!-- Remove Button (Red Outline + Icon) - Disabled when no data -->
        <button mat-stroked-button class="app-btn icon red" (click)="onRemoveClicked()"
          [disabled]="!selectedRows.length || !hasTableData()">
          <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/delete_red_icon.svg" alt="delete"
            class="btn-icon" />
          Remove
        </button>
        <!-- Edit Button (Blue Outline + Icon) - Disabled when no data -->
        <button mat-stroked-button class="app-btn icon blue" (click)="onEditClicked()"
          [disabled]="!selectedRows.length || !hasTableData()">
          <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/edit_blue_icon.svg" alt="edit"
            class="btn-icon" />
          Edit
        </button>

        <!-- Secondary Button -->
        <button mat-stroked-button class="app-btn secondary" (click)="onDownloadTemplate()">
          Download sample
        </button>
        <!-- Primary Button -->
        <button type="button" (click)="openUploadPopup()" mat-button class="app-btn primary">
          {{ uploadButtonText }}
        </button>
      </div>
    </div>
  </div>

  <!-- ✅ Reusable Table -->
  <app-upload-competency-list-table [columns]="tableConfig.columns" [data]="tableConfig.data" [showCheckbox]="true"
    [enableSorting]="true" [enablePagination]="false" [gridStyle]="'both'" [isEditing]="isEditing"
    (selectionChange)="onSelectionChange($event)">
  </app-upload-competency-list-table>
</div>
