<div class="frac-dashboard-container">

  <!-- Header Section -->
  <section class="header-section">
    <div class="welcome-text">Welcome to the FRAC</div>
    <div class="sub-text">
      Upload competencies, activities, and roles, and map them to build your organization's structure.
    </div>
  </section>

  <!-- Cards Grid Section -->
  <section class="cards-grid">
    <mat-card class="action-card" *ngFor="let card of actionCards">
      <!-- Card Content -->
      <div class="card-content">
        <div class="card-header">
          <h3 class="card-title">{{ card.title }}</h3>
          <p class="card-description">{{ card.description }}</p>
        </div>
      </div>

      <!-- Card Actions -->
      <div class="card-actions">
        <button type="button" (click)="onBtnClick(action.redirectLink)" class="action-btn"
          *ngFor="let action of card.actions">
          <img class="action-icon" [src]="getIconUrl(action.icon)" [alt]="action.label" />
          <span class="action-label">{{ action.label }}</span>
        </button>
      </div>
    </mat-card>
  </section>

  </section> -->

</div>
