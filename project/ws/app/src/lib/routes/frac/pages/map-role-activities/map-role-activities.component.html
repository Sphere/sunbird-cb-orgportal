<div class="header-container">
  <button class="home-chip" type="button" aria-label="Go to FRAC dashboard" (click)="onHomeClick()">
    <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/home-frac.svg" alt="home"
      class="home-icon" />
    <span class="home-label">Home</span>
  </button>

  <button mat-stroked-button class="save-btn" type="button" (click)="onSaveClicked()" [disabled]="!isEditing || isSaving"
    aria-label="Save role mappings">
    {{ isSaving ? 'Saving...' : 'Save' }}
  </button>
</div>

<div class="upload-container">
  <div class="loading-overlay" *ngIf="isSaving">
    <div class="spinner-container">
      <mat-spinner [diameter]="42" [strokeWidth]="4"></mat-spinner>
      <p class="loading-text">Saving role to activity mappings...</p>
    </div>
  </div>

  <div class="header">
    <button class="back-button" routerLink="/app/home/frac/dashboard" type="button" aria-label="Back to home">
      <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/frac-left-arrow.svg" alt="back"
        class="back-icon" />
    </button>
    <h2>Map Roles</h2>
  </div>

  <div class="sub-header">
    <span>Link each roles to activity</span>
  </div>

  <div class="left-tools">
    <div class="language-dropdown" (click)="toggleDropdown()" role="button" tabindex="0">
      <div class="dropdown-main">
        <div class="label-container">
          <div class="label">Language</div>
          <div class="selected">{{ selectedLanguage }}</div>
        </div>
        <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
      </div>

      <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
        <div *ngFor="let lang of languages" class="dropdown-item" (click)="selectLanguage(lang, $event)">
          {{ lang }}
        </div>
      </div>
    </div>
  </div>

  <!-- <div class="section-titles">
    <div class="section-title">List of Roles</div>
    <div class="section-title right">Available Activities</div>
  </div> -->

  <div class="content-layout">
    <!-- LEFT – ROLES PANEL -->
    <div class="roles-panel">
      <app-role-mapping-list [roles]="filteredRoles" [isLoading]="isRolesLoading"
        [selectedRoleCode]="selectedRole?.code || null"
        (searchChange)="onRoleSearch($event)"
        (roleSelected)="onRoleSelected($event)" (toggle)="onRoleToggleExpand($event)">
      </app-role-mapping-list>
    </div>

    <!-- RIGHT – ACTIVITIES PANEL -->
    <div class="activities-panel">
      <app-activity-mapping-table [activities]="filteredActivities" [selectedRole]="selectedRole"
        [selectedActivityMap]="selectedActivityMap" [isLoading]="isRoleMappingLoading || isActivitiesLoading"
        [isActionLoading]="isValidatingActivityMappings"
        (searchChange)="onActivitySearch($event)"
        (activityCheckChange)="onActivityCheckChanged($event)" (addActivity)="onAddActivityToRole()">
      </app-activity-mapping-table>
    </div>
  </div>
</div>
