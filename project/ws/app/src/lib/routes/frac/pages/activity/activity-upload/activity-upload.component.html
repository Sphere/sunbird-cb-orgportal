<!-- Top Navigation Bar -->
<div class="header-container">
  <button routerLink="/app/home/frac/dashboard" class="home-chip" type="button" aria-label="Go to FRAC dashboard">
    <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/home-frac.svg" alt="home"
      class="home-icon" />
    <span class="home-label">Home</span>
  </button>

  <button class="save-btn" (click)="onSaveClicked()" [disabled]="!isEditing || !hasTableData()">
    <span style="color: white;">Save</span>
  </button>
</div>

<!-- Main Content -->
<div class="upload-container">
  <!-- Page Header -->
  <div class="header">
    <button class="back-button" routerLink="/app/home/frac/dashboard" type="button" aria-label="Back to home">
      <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/frac-left-arrow.svg" alt="back"
        class="back-icon" />
    </button>
    <h2>Upload Activity</h2>
  </div>

  <!-- Sub Header -->
  <div class="sub-header">
    <span>Upload Activity File (CSV or JSON)</span>
  </div>

  <!-- Toolbar: Search, Language, Buttons -->
  <div class="toolbar">
    <!-- Left Tools: Search & Language Filter -->
    <div class="left-tools">
      <!-- Search Box -->
      <div class="search-box">
        <input matInput type="text" placeholder="Search by name, code" [(ngModel)]="searchTerm"
          (input)="onSearchTermChange()" (keydown.enter)="onSearchEnter()" />
        <button mat-icon-button matSuffix class="icon-btn" (click)="onSearch()">
          <mat-icon>search</mat-icon>
        </button>
      </div>

      <!-- Language Dropdown -->
      <div class="language-dropdown" (click)="toggleDropdown()">
        <div class="dropdown-main">
          <div class="label-container">
            <div class="label">Language</div>
            <div class="selected">{{ selectedLanguage }}</div>
          </div>
          <div class="icon">
            <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
          </div>
        </div>

        <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
          <div class="dropdown-item" *ngFor="let lang of languages" (click)="selectLanguage(lang, $event)">
            {{ lang }}
          </div>
        </div>
      </div>
    </div>

    <!-- Right Tools: Action Buttons -->
    <div class="right-tools">
      <div class="button-group">
        <!-- Remove Button -->
        <button mat-stroked-button class="app-btn icon red" (click)="onRemoveClicked()"
          [disabled]="!selectedRows.length || !hasTableData()">
          <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/delete_red_icon.svg" alt="delete"
            class="btn-icon" />
          Remove
        </button>

        <!-- Edit Button -->
        <button mat-stroked-button class="app-btn icon blue" (click)="onEditClicked()"
          [disabled]="!selectedRows.length || !hasTableData()">
          <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/edit_blue_icon.svg" alt="edit"
            class="btn-icon" />
          Edit
        </button>

        <!-- Download Template Button -->
        <button mat-stroked-button class="app-btn secondary" (click)="onDownloadTemplate()">
          Download sample
        </button>

        <!-- Upload File Button -->
        <button type="button" (click)="openUploadPopup()" mat-button class="app-btn primary">
          {{ uploadButtonText }}
        </button>
      </div>
    </div>
  </div>

  <!-- ✅ Loading Overlay with Custom Spinner -->
  <div class="loading-overlay" *ngIf="isUploading" [class.show]="isUploading">
    <div class="spinner-container">
      <div class="custom-loader">
        <mat-icon class="loader-icon">cloud_upload</mat-icon>
        <mat-spinner [diameter]="50" [strokeWidth]="4" class="loader-spinner"></mat-spinner>
      </div>
      <p class="loading-text">Uploading and processing your file...</p>
      <p class="loading-subtext">Please wait...</p>
    </div>
  </div>

  <div class="table-section">
    <div class="table-loading-overlay" *ngIf="isSearching && !isUploading">
      <div class="table-loader-content">
        <mat-spinner [diameter]="36" [strokeWidth]="4"></mat-spinner>
        <p>Loading table data...</p>
      </div>
    </div>

    <!-- Activity Table Component -->
    <app-upload-activity-list-table [columns]="tableConfig.columns" [data]="tableConfig.data" [showCheckbox]="true"
      [enableSorting]="true" [enablePagination]="false" [gridStyle]="'both'" [isEditing]="isEditing"
      (selectionChange)="onSelectionChange($event)">
    </app-upload-activity-list-table>
  </div>
</div>
