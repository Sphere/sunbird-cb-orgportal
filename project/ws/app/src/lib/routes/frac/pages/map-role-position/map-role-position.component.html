<div class="header-container">
  <button class="home-chip" type="button" aria-label="Go to FRAC dashboard" (click)="onHomeClick()">
    <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/home-frac.svg" alt="home"
      class="home-icon" />
    <span class="home-label">Home</span>
  </button>

  <button mat-stroked-button class="save-btn" type="button" (click)="onSaveClicked()" [disabled]="!isEditing || isSaving"
    aria-label="Save role mappings">
    {{ isSaving ? 'Saving...' : 'Save' }}
  </button>
</div>

<div class="upload-container">
  <div class="loading-overlay" *ngIf="isSaving">
    <div class="spinner-container">
      <mat-spinner [diameter]="42" [strokeWidth]="4"></mat-spinner>
      <p class="loading-text">Saving position to role mappings...</p>
    </div>
  </div>

  <div class="header">
    <button class="back-button" routerLink="/app/home/frac/dashboard" type="button" aria-label="Back to home">
      <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/frac-left-arrow.svg" alt="back"
        class="back-icon" />
    </button>
    <h2>Map Roles to Position</h2>
  </div>

  <div class="sub-header">
    <span>Map roles to existing positions in the system.</span>
  </div>

  <div class="left-tools">
    <div class="language-dropdown" (click)="toggleDropdown()" role="button" tabindex="0">
      <div class="dropdown-main">
        <div class="label-container">
          <div class="label">Language</div>
          <div class="selected">{{ selectedLanguage }}</div>
        </div>
        <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
      </div>

      <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
        <div *ngFor="let lang of languages" class="dropdown-item" (click)="selectLanguage(lang, $event)">
          {{ lang }}
        </div>
      </div>
    </div>
  </div>

  <div class="content-layout">
    <!-- LEFT – POSITIONS PANEL -->
    <div class="roles-panel">
      <app-position-mapping-list [roles]="filteredPositions" [isLoading]="isPositionsLoading"
        [selectedPositionCode]="selectedPosition?.code || null"
        (searchChange)="onPositionSearch($event)"
        (searchSubmit)="onPositionSearchSubmit($event)"
        (roleSelected)="onPositionSelected($event)" (toggle)="onPositionToggleExpand($event)">
      </app-position-mapping-list>
    </div>

    <!-- RIGHT – ROLES PANEL -->
    <div class="positions-panel">
      <app-role-mapping-table [positions]="filteredRoles" [selectedRole]="selectedPosition"
        [selectedPositionMap]="selectedRoleMap" [isLoading]="isRolesLoading || isPositionRoleMappingLoading"
        (searchChange)="onRoleSearch($event)"
        (positionCheckChange)="onRoleCheckChanged($event)" (addPosition)="onAddRoleToPosition()">
      </app-role-mapping-table>
    </div>
  </div>
</div>
