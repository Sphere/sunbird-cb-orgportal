<div class="header-container">
  <button class="back-nav-btn" type="button" (click)="onHomeClick()" aria-label="Back to home">
    <mat-icon>arrow_back</mat-icon>
    <span>Back</span>
  </button>

  <div class="view-only-banner" *ngIf="selectedLanguage !== 'en'">
    <mat-icon>info</mat-icon>
    <span>You are currently viewing mappings for <strong>{{ getLangLabel(selectedLanguage) }}</strong>. To make changes or add new
      mappings, please switch to English.</span>
  </div>

  <div class="header-tools">
    <div class="language-dropdown header-language-dropdown">
      <button type="button" style="all: unset; display: contents; cursor: pointer;" (click)="toggleDropdown()">
        <div class="dropdown-main">
          <div class="label-container">
            <div class="label">Language</div>
            <div class="selected">{{ getLangLabel(selectedLanguage) }}</div>
          </div>
          <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
        </div>
      </button>

      <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()">
        <div *ngFor="let lang of languages" class="dropdown-item">
          <button type="button" style="all: unset; display: contents; cursor: pointer;"
            (click)="selectLanguage(lang, $event)">
            {{ lang.label }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="upload-container">
  <div class="loading-overlay" *ngIf="isSaving">
    <div class="spinner-container">
      <mat-spinner [diameter]="mapPageSpinner.diameter" [strokeWidth]="mapPageSpinner.strokeWidth"></mat-spinner>
      <p class="loading-text">Saving position to role mappings...</p>
    </div>
  </div>

  <div class="header">
    <h2>Map Roles to Position</h2>
  </div>

  <div class="sub-header">
    <span>Map roles to existing positions in the system.</span>
  </div>

  <div class="content-layout">
    <!-- LEFT – POSITIONS PANEL -->
    <div class="roles-panel">
      <app-position-mapping-list [roles]="filteredPositions" [isLoading]="isPositionsLoading"
        [searchResetKey]="searchResetKey" [selectedPositionCode]="selectedPosition?.code || null"
        (searchChange)="onPositionSearch($event)" (searchSubmit)="onPositionSearchSubmit($event)"
        (roleSelected)="onPositionSelected($event)" (toggle)="onPositionToggleExpand($event)">
      </app-position-mapping-list>
    </div>

    <!-- RIGHT – ROLES PANEL -->
    <div class="positions-panel">
      <app-role-mapping-table [positions]="filteredRoles" [selectedRole]="selectedPosition"
        [searchResetKey]="searchResetKey" [selectedPositionMap]="selectedRoleMap"
        [isLoading]="isRolesLoading || isPositionRoleMappingLoading" [isReadOnly]="!isEditing"
        [isSaving]="isSaving" (searchChange)="onRoleSearch($event)" (positionCheckChange)="onRoleCheckChanged($event)"
        (addPosition)="onAddRoleToPosition()">
      </app-role-mapping-table>
    </div>
  </div>
</div>
