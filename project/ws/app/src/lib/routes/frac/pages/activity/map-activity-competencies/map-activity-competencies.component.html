<div class="header-container">
  <button routerLink="/app/home/frac/dashboard" class="home-chip" type="button" aria-label="Go to FRAC dashboard">
    <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/home-frac.svg" alt="home"
      class="home-icon" />
    <span class="home-label">Home</span>
  </button>

  <button mat-stroked-button class="save-btn" type="button" (click)="onSaveClicked()" [disabled]="!isEditing"
    aria-label="Save mappings">
    Save
  </button>
</div>

<div class="upload-container">
  <div class="header">
    <button class="back-button" routerLink="/home" type="button" aria-label="Back to home">
      <img src="https://aastar-assets.s3.ap-south-1.amazonaws.com/mdo-frac/icons/frac-left-arrow.svg" alt="back"
        class="back-icon" />
    </button>
    <h2>Map activities</h2>
  </div>

  <div class="sub-header">
    <span>Link each activity to one or more competency levels.</span>
  </div>

  <div class="left-tools">
    <div class="language-dropdown" (click)="toggleDropdown()" role="button" tabindex="0">
      <div class="dropdown-main">
        <div class="label-container">
          <div class="label">Language</div>
          <div class="selected">{{ selectedLanguage }}</div>
        </div>
        <mat-icon>{{ isOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
      </div>

      <div class="dropdown-list" *ngIf="isOpen" (click)="$event.stopPropagation()">
        <div *ngFor="let lang of languages" class="dropdown-item" (click)="selectLanguage(lang, $event)">
          {{ lang }}
        </div>
      </div>
    </div>
  </div>

  <div class="content-layout">
    <div class="activities-panel">
      <app-activity-mapping-list [activities]="filteredActivities" (searchChange)="onActivitySearch($event)"
        (activitySelected)="onActivitySelected($event)" (toggle)="expand($event)">
      </app-activity-mapping-list>
    </div>

    <div class="competency-panel">
      <app-competency-mapping-table [competencies]="competencies" [selectedActivity]="selectedActivity"
        [selectedMap]="selectedMap" (checked)="onCheck($event)" (searchChange)="onCompetencySearch($event)"
        (addCompetency)="onAddCompetencyToActivity($event)">
      </app-competency-mapping-table>
    </div>
  </div>
</div>
