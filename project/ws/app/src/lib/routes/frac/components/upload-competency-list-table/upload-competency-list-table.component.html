<div class="upload-competency-list-table-container" [ngClass]="gridStyle">
  <table mat-table [dataSource]="dataSource" matSort class="data-table">
    <!-- Checkbox column: 50px fixed width -->
    <ng-container matColumnDef="select" *ngIf="showCheckbox">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="onRowSelect(row)" (keydown)="onRowSelect(row)"
          [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Dynamic columns - use active columns (default or provided) -->
    <ng-container *ngFor="let col of getActiveColumns()" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element">
        <!-- Edit mode: shows input field for selected rows -->
        <ng-container *ngIf="isEditing && selection.isSelected(element); else viewMode">
          <div class="cell-edit-wrapper">
            <input [(ngModel)]="element[col.key]" class="editable-input" />
          </div>
        </ng-container>

        <!-- View mode: displays cell content -->
        <ng-template #viewMode>
          <div class="cell-content">{{ element[col.key] }}</div>
        </ng-template>
      </td>
    </ng-container>

    <!-- Table header row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Table data rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>
  </table>

  <!-- Empty state: Grid rows with column headers -->

      <thead class="sr-only">
        <tr>

      <tbody>
        <tr class="empty-row" *ngFor="let i of getEmptyRows()">
          <td *ngIf="showCheckbox"></td>
          <td *ngFor="let col of getActiveColumns()"></td>
        </tr>
      </tbody>
    </table>
  </div> -->

  <!-- <div class="table-filler" *ngIf="dataSource.data.length > 0">

      <thead class="sr-only">
        <tr>

      <tbody>

        </tr>
      </tbody>
    </table>
  </div> -->
</div>

<!-- Pagination footer (optional) -->
<mat-paginator *ngIf="enablePagination" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons>
</mat-paginator>
