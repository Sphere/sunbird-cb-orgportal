<div class="upload-popup-container">
  <h2 class="popup-title">{{ config.title }}</h2>
  <p class="popup-subtext" *ngIf="config.subText">{{ config.subText }}</p>

  <!-- Optional Additional Content -->
  <div *ngIf="config.additionalContent?.show && config.additionalContent?.html" class="extra-content"
    [innerHTML]="config.additionalContent.html"></div>

  <!-- File Upload Section -->
  <!-- <div class="upload-section" *ngIf="!selectedFile">
    <div class="upload-box">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <p class="drag-text">{{ config.fileSection?.dragText || 'Drag & drop a file here' }}</p>
      <button mat-flat-button color="primary" class="upload-btn" (click)="fileInput.click()">
        {{ config.fileSection?.uploadButton || 'Upload File' }}
      </button>
      <input #fileInput type="file" [accept]="allowedTypes" (change)="onFileSelected($event)" hidden />
    </div>
  </div> -->

  <!-- Pre-upload (no file selected) -->
  <!-- Drag & Drop + Upload File Section -->
  <div class="upload-box" *ngIf="!selectedFile" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
    (drop)="onFileDrop($event)" [class.drag-over]="isDragOver">
    <div class="file-icon">
      <img [src]="uiConfig.icons.uploadDocs" alt="Upload docs" class="file-icon-img" />
    </div>

    <div class="upload-text">
      {{ config.fileSection?.dragText || 'Drag and drop a file here' }}
    </div>
    <div class="or-text">(or)</div>

    <button mat-stroked-button class="upload-btn" (click)="fileInput.click()">
      {{ config.fileSection?.uploadButton || 'Upload File' }}
    </button>

    <input type="file" hidden #fileInput [accept]="allowedTypes" (change)="onFileSelected($event)" />
  </div>


  <!-- File Selected Card -->
  <!-- <div class="file-card" *ngIf="selectedFile">
    <div class="file-card-content">
      <mat-icon class="file-icon">description</mat-icon>
      <div class="file-details">
        <div class="file-name">{{ selectedFile.name }}</div>
        <div class="file-size">{{ (selectedFile.size / 1024) | number: '1.0-0' }} KB</div>
      </div>
    </div>
    <button mat-icon-button color="warn" (click)="removeFile()" class="file-remove-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div> -->
  <!-- File selected view -->
  <div class="file-selected-box" *ngIf="selectedFile">
    <div class="file-header">
      <div class="file-icon">
        <mat-icon>description</mat-icon>
      </div>
      <div class="file-name" [title]="selectedFile?.name">{{ selectedFile?.name }}</div>

      <button mat-icon-button class="close-btn" (click)="removeFile()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>




  <!-- Actions -->
  <div class="popup-actions">
    <button mat-stroked-button class="btn-secondary" (click)="close()">
      {{ config.actions?.secondary?.label || 'Cancel' }}
    </button>

    <!-- <button mat-stroked-button class="upload-btn "[disabled]="config.actions?.primary?.disabled || !selectedFile"
      (click)="onConfirmUpload()">
      {{ config.actions?.primary?.label || 'Confirm & Upload' }}
    </button> -->
    <button mat-stroked-button class="upload-btn" [disabled]="!selectedFile" (click)="onConfirmUpload()"
      *appHideForViewOnly>
      {{ config.actions?.primary?.label || 'Confirm & Upload' }}
    </button>
  </div>
</div>
