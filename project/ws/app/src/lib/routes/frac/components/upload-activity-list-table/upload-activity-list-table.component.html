<div class="activity-table-container" [ngClass]="gridStyle">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1" style="table-layout: fixed;">
    <!-- Checkbox selection column: 50px fixed width for consistent alignment with filler rows -->
    <ng-container matColumnDef="select" *ngIf="showCheckbox">
      <th mat-header-cell *matHeaderCellDef #headerCell style="width: 50px;"></th>
      <td mat-cell *matCellDef="let row" style="width: 50px;">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="onRowSelect(row)" (keydown)="onRowSelect(row)"
          [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Dynamic data columns -->
    <ng-container *ngFor="let col of activeColumns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef #headerCell mat-sort-header [style.width]="col.width">
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element" [style.width]="col.width">
        <!-- Edit mode: shows input field for selected rows -->
        <ng-container *ngIf="isEditing && selection.isSelected(element); else viewMode">
          <div class="cell-edit-wrapper">
            <input [(ngModel)]="element[col.key]" class="editable-input" [readonly]="isCodeField(col.key)"
              [disabled]="isCodeField(col.key)" [attr.aria-label]="col.label"
              [class.readonly-input]="isCodeField(col.key)" />
          </div>
        </ng-container>

        <!-- View mode: displays cell content -->
        <ng-template #viewMode>
          <div class="cell-content">{{ element[col.key] }}</div>
        </ng-template>
      </td>
    </ng-container>

    <!-- Table header row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Table data rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>
  </table>

  <div class="rows-loading-overlay" *ngIf="isLoading">
    <div class="rows-loading-row" *ngFor="let _ of [1, 2, 3, 4, 5, 6, 7, 8]">
      <div
        class="rows-loading-cell checkbox-cell"
        *ngIf="showCheckbox"
        [style.width.px]="getLoadingCellWidth(0) || null"
        [style.flex]="getLoadingCellWidth(0) ? '0 0 auto' : null">
        <div class="shimmer-box checkbox"></div>
      </div>
      <div
        class="rows-loading-cell"
        *ngFor="let col of activeColumns; let colIndex = index"
        [class.code-cell]="col.key === 'code'"
        [class.name-cell]="col.key === 'name'"
        [style.width.px]="getLoadingCellWidth(colIndex + (showCheckbox ? 1 : 0)) || null"
        [style.flex]="getLoadingCellWidth(colIndex + (showCheckbox ? 1 : 0)) ? '0 0 auto' : null">
        <div class="shimmer-box text"></div>
      </div>
    </div>
  </div>

  <!-- Empty state: bordered grid rows for visual consistency (when no data) -->
  <div class="table-filler" *ngIf="dataSource.data.length === 0">
    <table class="empty-table">
      <thead class="sr-only">
        <tr>
          <th *ngIf="showCheckbox"></th>
          <th *ngFor="let col of activeColumns"></th>
        </tr>
      </thead>
      <tr class="empty-row" *ngFor="let i of emptyRows">
        <!-- Checkbox column empty cell: 50px fixed width -->
        <td class="empty-cell" *ngIf="showCheckbox" style="width: 50px;">&nbsp;</td>
        <!-- Data column empty cells -->
        <td class="empty-cell" *ngFor="let col of activeColumns" [style.width]="col.width">&nbsp;</td>
      </tr>
    </table>
  </div>

  <!-- Filler rows when data exists but doesn't fill container height -->
  <div class="table-filler" *ngIf="dataSource.data.length > 0">
    <table class="empty-table">
      <thead class="sr-only">
        <tr>
          <th *ngIf="showCheckbox"></th>
          <th *ngFor="let col of activeColumns"></th>
        </tr>
      </thead>
      <tr class="empty-row" *ngFor="let i of fillerRows">
        <!-- Checkbox column empty cell: 50px fixed width -->
        <td class="empty-cell" *ngIf="showCheckbox" style="width: 50px;">&nbsp;</td>
        <!-- Data column empty cells -->
        <td class="empty-cell" *ngFor="let col of activeColumns" [style.width]="col.width">&nbsp;</td>
      </tr>
    </table>
  </div>
</div>

<!-- Pagination footer (optional) -->
<mat-paginator *ngIf="enablePagination" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons>
</mat-paginator>
