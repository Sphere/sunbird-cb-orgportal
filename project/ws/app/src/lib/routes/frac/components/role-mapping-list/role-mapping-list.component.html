<div class="role-mapping-list">

  <div class="toolbar">
    <div class="title-header">List of Roles</div>
  </div>

  <div class="role-container">
    <div class="title-bar">Roles</div>

    <div class="scroll-area">

      <!-- search bar -->
      <div class="search-row">
        <div class="shadow-wrapper">
          <div class="search-box">
            <input placeholder="Search by name, code" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
            <mat-icon>search</mat-icon>
          </div>
        </div>
      </div>

      <!-- role list -->
      <ng-container *ngIf="isLoading">
        <div class="role-item shimmer-item" *ngFor="let _ of [1, 2, 3, 4]">
          <div class="expanded-card">
            <div class="shimmer-line code"></div>
            <div class="shimmer-line title"></div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!isLoading">
        <div class="role-item" *ngFor="let r of filteredRoles; trackBy: trackByCode"
          [class.selected]="selectedRoleCode === r.code" role="option" tabindex="0"
          [attr.aria-selected]="selectedRoleCode === r.code"
          (click)="roleSelectedHandler(r)" (keydown.enter)="roleSelectedHandler(r)"
          (keydown.space)="roleSelectedHandler(r); $event.preventDefault()">
          <div class="expanded-card">

            <div class="header-row" role="button" tabindex="0" (click)="onHeaderClick(r, $event)"
              (keydown.enter)="onHeaderClick(r, $any($event))"
              (keydown.space)="onHeaderClick(r, $any($event)); $event.preventDefault()">
              <div class="exp-code">{{ r.code }}</div>
              <div class="exp-title">{{ r.title }}</div>
              <!-- Expand arrow (show only when levels are valid) -->
              <mat-icon *ngIf="r.activityDetails?.length > 0" class="arrow">
                {{ expandedRoleCode === r.code ? 'expand_less' : 'expand_more' }}
              </mat-icon>
            </div>

            <!-- mapped activities under role -->
            <div *ngIf="expandedRoleCode === r.code && r.activityDetails?.length" class="activity-section">
              <div class="activity-row" *ngFor="let a of getSortedActivities(r)">
                <div class="pill">
                  <div class="activity-label">{{ a.code }} - {{ a.label }}</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </ng-container>

      <div *ngIf="!isLoading && filteredRoles.length === 0" class="no-data">
        <div class="empty-state-card">
          <div class="icon-shell">
            <mat-icon class="empty-state-icon">manage_search</mat-icon>
          </div>
          <div class="empty-state-title">No role found</div>
          <div class="empty-state-message">Use the search bar to find the role to map.</div>
        </div>
      </div>

    </div>
  </div>
</div>
