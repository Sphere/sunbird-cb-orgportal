<div class="frac-table-container" [style.max-height]="maxHeight" [ngClass]="gridStyle">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
    <!-- Checkbox column -->
    <ng-container matColumnDef="select" *ngIf="showCheckbox">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="masterToggle()" [checked]="isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)"></mat-checkbox>
      </td>
    </ng-container>

    <!-- Dynamic columns -->
    <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header [style.width]="col.width">
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element">{{ element[col.key] }}</td>
    </ng-container>

    <!-- Header and rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>
  </table>
</div>

<!-- Pagination -->
<mat-paginator *ngIf="enablePagination" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons></mat-paginator>
