<div class="frac-table-container" [ngClass]="gridStyle">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1" style="table-layout: fixed;">
    <!-- Checkbox column: 50px fixed width for consistent alignment with filler rows -->
    <ng-container matColumnDef="select" *ngIf="showCheckbox">
      <th mat-header-cell *matHeaderCellDef style="width: 50px;"></th>
      <td mat-cell *matCellDef="let row" style="width: 50px;">
        <mat-checkbox (click)="$event.stopPropagation()" (keydown.enter)="$event.stopPropagation()"
          (keydown.space)="$event.stopPropagation()" (change)="onRowSelect(row)"
          [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)" appDisableForViewOnly>
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Dynamic columns -->
    <ng-container *ngFor="let col of columns" [matColumnDef]="col.key">
      <th mat-header-cell *matHeaderCellDef mat-sort-header [style.width]="col.width">
        {{ col.label }}
      </th>
      <td mat-cell *matCellDef="let element">
        <!-- Edit mode: shows input field for selected rows -->
        <ng-container *ngIf="isEditing && selection.isSelected(element); else viewMode">
          <div class="cell-edit-wrapper">
            <input [(ngModel)]="element[col.key]" class="editable-input" />
          </div>
        </ng-container>

        <!-- View mode: displays cell content with text wrapping -->
        <ng-template #viewMode>
          <div class="cell-content" [innerHTML]="element[col.key] | wordWrap:wordWrapLimit"></div>
        </ng-template>
      </td>
    </ng-container>

    <!-- Table header row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Table data rows -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns" class="data-row"></tr>
  </table>

  <!-- Empty state: bordered grid rows for visual consistency (when no data) -->
  <div class="table-filler" *ngIf="dataSource.data.length === 0">
    <div class="empty-table">
      <div class="empty-row" *ngFor="let i of getEmptyRows()">
        <!-- Checkbox column empty cell: 50px fixed width -->
        <div class="empty-cell" *ngIf="showCheckbox" style="width: 50px;">&nbsp;</div>
        <!-- Data column empty cells -->
        <div class="empty-cell" *ngFor="let col of columns" [style.width]="col.width">&nbsp;</div>
      </div>
    </div>
  </div>

  <!-- Filler rows when data exists but doesn't fill container height -->
  <div class="table-filler" *ngIf="dataSource.data.length > 0">
    <div class="empty-table">
      <div class="empty-row" *ngFor="let i of getEmptyRowsForData()">
        <!-- Checkbox column empty cell: 50px fixed width -->
        <div class="empty-cell" *ngIf="showCheckbox" style="width: 50px;">&nbsp;</div>
        <!-- Data column empty cells -->
        <div class="empty-cell" *ngFor="let col of columns" [style.width]="col.width">&nbsp;</div>
      </div>
    </div>
  </div>
</div>

<!-- Pagination footer (optional) -->
<mat-paginator *ngIf="enablePagination" [pageSizeOptions]="pageSizeOptions" showFirstLastButtons>
</mat-paginator>
