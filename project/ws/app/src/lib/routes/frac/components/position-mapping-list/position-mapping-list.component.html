<div class="position-mapping-list">

  <div class="toolbar">
    <div class="title-header">Positions</div>
  </div>

  <div class="role-container">
    <div class="title-bar">Positions</div>

    <div class="scroll-area">

      <!-- search bar -->
      <div class="search-row">
        <div class="shadow-wrapper">
          <div class="search-box">
            <input placeholder="Search by name, code" [(ngModel)]="searchTerm"
              (input)="onSearchChange()" (keyup.enter)="onSearchSubmit()" />
            <mat-icon role="button" tabindex="0" (click)="onSearchSubmit()" (keydown.enter)="onSearchSubmit()"
              (keydown.space)="onSearchSubmit(); $event.preventDefault()">search</mat-icon>
          </div>
        </div>
      </div>

      <!-- position list -->
      <ng-container *ngIf="isLoading">
        <div class="role-item shimmer-item" *ngFor="let _ of [1, 2, 3, 4]">
          <div class="expanded-card">
            <div class="shimmer-line title"></div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="!isLoading">
        <div class="role-item" *ngFor="let r of filteredRoles; trackBy: trackByCode"
          [class.selected]="selectedPositionCode === r.code" role="option" tabindex="0"
          [attr.aria-selected]="selectedPositionCode === r.code"
          (click)="roleSelectedHandler(r)" (keydown.enter)="roleSelectedHandler(r)"
          (keydown.space)="roleSelectedHandler(r); $event.preventDefault()">
          <div class="expanded-card">

            <div class="header-row" role="button" tabindex="0" (click)="onHeaderClick(r, $event)"
              (keydown.enter)="onHeaderClick(r, $any($event))"
              (keydown.space)="onHeaderClick(r, $any($event)); $event.preventDefault()">
              <div class="exp-code">{{ r.title }}</div>
              <!-- <div class="exp-title">{{ r.title || r.description || '-' }}</div> -->
              <!-- Expand arrow (show only when levels are valid) -->
              <mat-icon *ngIf="r.roleDetails?.length > 0" class="arrow">
                {{ expandedPositionCode === r.code ? 'expand_less' : 'expand_more' }}
              </mat-icon>
            </div>

            <!-- mapped positions under role -->
            <div *ngIf="expandedPositionCode === r.code && r.roleDetails?.length" class="position-section">
              <div class="position-row" *ngFor="let p of getSortedRoles(r)">
                <div class="pill">
                  <div class="position-label">{{ p.code }} - {{ p.label }}</div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </ng-container>

      <div *ngIf="!isLoading && filteredRoles.length === 0" class="no-data">
        <div class="empty-state-card">
          <div class="icon-shell">
            <mat-icon class="empty-state-icon">manage_search</mat-icon>
          </div>
          <div class="empty-state-title">No position found</div>
          <div class="empty-state-message">Use the search bar to find the position to map.</div>
        </div>
      </div>

    </div>
  </div>
</div>
