<div class="activity-mapping-table">

  <div class="toolbar">
    <div class="title-bar">Available Activities</div>

    <div class="button-group">
      <button mat-stroked-button class="app-btn secondary" [disabled]="isAddDisabled()" (click)="onAddActivity()">
        Add activity
      </button>
    </div>
  </div>

  <div class="activity-wrapper">
    <div class="header-strip">
      <div class="check-header"></div>
      <div class="code-label">Code &amp; Label</div>
    </div>

    <div class="scroll-area">

      <!-- search bar -->
      <div class="search-row">
        <div class="search-cell">
          <div class="search-box">
            <input placeholder="Search by name, code" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
            <mat-icon>search</mat-icon>
          </div>
        </div>
      </div>

      <!-- table rows -->
      <div class="rows-wrapper">
        <div class="activity-row" *ngFor="let a of filteredActivities">
          <div class="check-cell">
            <mat-checkbox [checked]="isChecked(a.code)" (change)="onCheckboxChange(a.code, $event.checked)">
            </mat-checkbox>
          </div>
          <div class="text-cell">
            {{ a.code }}- {{ a.title }}
          </div>
        </div>
      </div>

      <div *ngIf="filteredActivities.length === 0" class="no-data">
        {{ emptyStateMessage }}
      </div>

    </div>
  </div>
</div>
