<div class="competency-mapping-table">

  <!-- Toolbar with title and action button -->
  <div class="toolbar">
    <div class="title-bar">Available Competencies</div>

    <div class="button-group">
      <button mat-stroked-button class="app-btn secondary" (click)="onAddCompetency()">
        Add Competency
      </button>
    </div>
  </div>

  <div class="competency-wrapper">

    <div class="horizontal-scroll">
      <div class="grid-container">

        <!-- Header row -->
        <div class="header-bar grid-row">
          <div class="cell label-cell">{{ headerConfig.codeLabel }}</div>

          <div class="cell level-cell" *ngFor="let lvl of headerConfig.levels">
            {{ lvl }}
          </div>
        </div>

        <!-- Search row -->
        <div class="search-row">
          <div class="search-box">
            <input [placeholder]="headerConfig.searchPlaceholder" [(ngModel)]="searchTerm" (input)="onSearchChange()" />
            <mat-icon>search</mat-icon>
          </div>
        </div>

        <!-- Table records -->
        <div class="table-area">
          <div class="grid-row data-row" *ngFor="let c of filteredCompetencies">

            <!-- Competency label column -->
            <div class="cell label-cell">
              <div class="text">{{ c.code }} - {{ c.label }}</div>
            </div>

            <!-- Level checkboxes -->
            <div class="cell checkbox-cell" *ngFor="let lvl of c.levels">
              <mat-checkbox [checked]="isChecked(c.code, lvl.code)"
                (change)="checkChange(c.code, lvl.code, $event.checked)">
              </mat-checkbox>
            </div>

          </div>
        </div>
        <!-- No data message -->
        <div *ngIf="filteredCompetencies.length === 0" class="no-data">
          Use the search bar to find the competency to map.
        </div>
      </div>
    </div>

  </div>
</div>
