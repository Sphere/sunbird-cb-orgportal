<div class="role-mapping-table">

  <div class="toolbar">
    <div class="title-bar">Available Roles</div>

    <div class="button-group">
      <button mat-stroked-button class="app-btn secondary" [disabled]="isAddDisabled()" (click)="onAddPosition()">
        Add roles
      </button>
    </div>
  </div>

  <div class="position-wrapper">
    <div class="header-strip">
      <div class="check-header"></div>
      <div class="code-label">Code &amp; Label</div>
    </div>

    <div class="scroll-area">

      <!-- search bar -->
      <div class="search-row">
        <div class="search-cell">
          <div class="search-box">
            <input placeholder="Search by name, code" [(ngModel)]="searchTerm"
              [disabled]="!selectedRole" (input)="onSearchChange()" />
            <mat-icon>search</mat-icon>
          </div>
        </div>
      </div>

      <!-- table rows -->
      <div class="rows-wrapper" [class.loading]="isLoading">
        <ng-container *ngIf="isLoading">
          <div class="shimmer-state">
            <div class="position-row shimmer-row" *ngFor="let _ of [1, 2, 3, 4, 5]">
              <div class="check-cell">
                <div class="shimmer-box checkbox"></div>
              </div>
              <div class="text-cell">
                <div class="shimmer-box text"></div>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="!isLoading">
          <div class="position-row" *ngFor="let p of filteredPositions">
            <div class="check-cell">
              <mat-checkbox [checked]="isChecked(p.code)" (change)="onCheckboxChange(p.code, $event.checked)">
              </mat-checkbox>
            </div>
            <div class="text-cell">
              {{ p.code }}- {{ p.title }}
            </div>
          </div>
        </ng-container>
      </div>

      <div *ngIf="!isLoading && filteredPositions.length === 0" class="no-data">
        <div class="no-data-text">
          <span>{{ emptyStateMessage }}</span>
        </div>
      </div>

    </div>
  </div>
</div>
