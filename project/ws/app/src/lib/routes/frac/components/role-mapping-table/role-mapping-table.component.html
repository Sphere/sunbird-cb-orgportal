<div class="role-mapping-table">

  <div class="toolbar">
    <div class="title-bar">Available Roles</div>

    <div class="button-group">
      <button *ngIf="!isReadOnly" mat-raised-button class="app-btn primary" [disabled]="isAddDisabled()"
        (click)="onAddPosition()">
        <mat-spinner *ngIf="isSaving" class="btn-spinner" [diameter]="16" [strokeWidth]="2"></mat-spinner>
        {{ isSaving ? 'Saving...' : 'Add Role' }}
      </button>
    </div>
  </div>

  <div class="position-wrapper">
    <div class="header-strip">
      <div class="check-header"></div>
      <div class="code-label" style="cursor: pointer; display: flex; align-items: center;" (click)="toggleSort()">
        Code &amp; Name
        <mat-icon style="font-size: 16px; margin-left: 4px;"
          *ngIf="sortDirection">{{ sortDirection === 'asc' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
      </div>
    </div>

    <div class="scroll-area">

      <!-- search bar -->
      <div class="search-row">
        <div class="search-cell">
          <div class="search-box">
            <input placeholder="Search by name, code" [(ngModel)]="searchTerm" [disabled]="!selectedRole || isReadOnly"
              (input)="onSearchChange()" />
            <mat-icon>search</mat-icon>
          </div>
        </div>
      </div>

      <!-- table rows -->
      <div class="rows-wrapper" [class.loading]="isLoading">
        <ng-container *ngIf="isLoading">
          <div class="shimmer-state">
            <div class="position-row shimmer-row" *ngFor="let _ of [1, 2, 3, 4, 5]">
              <div class="check-cell">
                <div class="shimmer-box checkbox"></div>
              </div>
              <div class="text-cell">
                <div class="shimmer-box text"></div>
              </div>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="!isLoading">
          <div class="position-row" *ngFor="let p of filteredPositions">
            <div class="check-cell">
              <mat-checkbox [checked]="isChecked(p.code)" [disabled]="isReadOnly"
                (change)="onCheckboxChange(p.code, $event.checked)">
              </mat-checkbox>
            </div>
            <div class="text-cell">
              {{ p.code }}- {{ p.title }}
            </div>
          </div>
        </ng-container>
      </div>

      <div *ngIf="!isLoading && filteredPositions.length === 0" class="no-data">
        <div class="empty-state-card">
          <div class="icon-shell">
            <mat-icon class="empty-state-icon">{{ emptyStateIcon }}</mat-icon>
          </div>
          <div class="empty-state-title">{{ emptyStateTitle }}</div>
          <div class="empty-state-message">{{ emptyStateMessage }}</div>
        </div>
      </div>

    </div>
  </div>
</div>
