<div class="create-user-page">

  <ws-widget-breadcrumbs-org
    [widgetData]="{titles:[{title:'Users', url:'/app/home/users'},{title:'Active', url:'none'},{title:'New User',url:'none'}]}">
  </ws-widget-breadcrumbs-org>

  <mat-sidenav-container class="sticky" autosize name="discuss-menu">
    <mat-sidenav [(opened)]="sideNavBarOpened" class="left-nav">
      <div class="container2" #stickyMenu>
        <ng-container [wsResolverWidget]="widgetData"></ng-container>
      </div>
    </mat-sidenav>

    <mat-sidenav-content>
      <div *ngIf="screenSizeIsLtMedium">
        <button type="button" mat-icon-button (click)="sideNavBarOpened = !sideNavBarOpened"
          id="ws-auth-root-home-btn-menu" name="ws-auth-root-home-btn-menu">
          <mat-icon>menu</mat-icon>
        </button>
      </div>

      <div class="form-page">
        <div class="form-card">
          <form [formGroup]="createUserForm" class="user-form">

            <h2 class="form-section-title">User details</h2>

            <!-- First name -->
            <div class="field-group">
              <label for="fname" class="field-label">
                First name <span class="required-mark">*</span>
              </label>
              <input id="fname" type="text" class="field-input" formControlName="fname" placeholder="Type here"
                autocomplete="off" i18n-aria-label aria-label="First name input" />
              <div class="field-error"
                *ngIf="createUserForm?.controls['fname']?.touched && createUserForm?.controls['fname'].errors?.required"
                i18n aria-live="polite">
                First name is mandatory
              </div>
              <div class="field-error" *ngIf="createUserForm?.controls['fname'].errors?.pattern" aria-live="polite">
                Name fields cannot contain numbers and special characters except '
              </div>
            </div>

            <!-- Last name -->
            <div class="field-group">
              <label for="lname" class="field-label">
                Last name <span class="required-mark">*</span>
              </label>
              <input id="lname" type="text" class="field-input" formControlName="lname" placeholder="Type here"
                autocomplete="off" i18n-aria-label aria-label="Last name input" />
              <div class="field-error"
                *ngIf="createUserForm?.controls['lname']?.touched && createUserForm?.controls['lname'].errors?.required"
                aria-live="polite">
                Last name is mandatory
              </div>
              <div class="field-error" *ngIf="createUserForm?.controls['lname'].errors?.pattern" aria-live="polite">
                Last name fields cannot contain numbers and special characters except '
              </div>
            </div>

            <!-- Email -->
            <div class="field-group">
              <label for="email" class="field-label">
                Email <span class="required-mark">*</span>
              </label>
              <input id="email" type="email" class="field-input" formControlName="email" placeholder="Type here"
                autocomplete="off" i18n-aria-label aria-label="Email input" />
              <div class="field-error"
                *ngIf="createUserForm?.controls['email']?.touched && createUserForm?.controls['email'].errors?.required"
                aria-live="polite">
                Email is mandatory
              </div>
              <div class="field-error" *ngIf="createUserForm?.controls['email'].errors?.eamil" aria-live="polite">
                Email field is not valid
              </div>
            </div>

            <!-- Department -->
            <div class="field-group">
              <label for="department" class="field-label">
                Department <span class="required-mark">*</span>
              </label>
              <input id="department" type="text" class="field-input" [(ngModel)]="departmentName"
                formControlName="department" placeholder="Type here" readonly i18n-aria-label
                aria-label="Department input" />
            </div>

            <!-- Role -->
            <div class="field-group">
              <label for="roles" class="field-label">
                Role <span class="required-mark">*</span>
              </label>
              <mat-selection-list id="roles" formControlName="roles" #roles class="role-list">
                <mat-list-option *ngFor="let role of rolesList" (click)="modifyUserRoles(role)"
                  (keydown.enter)="modifyUserRoles(role)" [selected]="role.roleName === 'PUBLIC'"
                  [disabled]="role.roleName === 'PUBLIC'" [value]="role.roleName">
                  {{role.roleName}}
                </mat-list-option>
              </mat-selection-list>
            </div>

            <div class="form-footer">
              <button type="submit" class="create-btn" (click)="onSubmit(createUserForm)"
                [disabled]="createUserForm?.invalid">
                Create user
              </button>
            </div>

          </form>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

</div>
