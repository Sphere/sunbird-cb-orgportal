<mat-tab-group *ngIf="dashboardData.length>0" color="primary">
  <mat-tab *ngFor="let report of dashboardData" [label]="report.name">
    <div class="iframe-container">
      <iframe title="iframe" [src]="report.link | safeUrl" width="100%" height="600" allowFullScreen>
      </iframe>
    </div>
  </mat-tab>
</mat-tab-group>
<div *ngIf="dashboardData.length < 1"
  style="display: flex; justify-content: center; align-items: center; height: auto; text-align: center;">
  <span>No Reports found.</span>
</div>
