<div class="tab-content">
  <div class="event-details">
    <p><strong>Date:</strong> {{ selectedEvent?.eventDate | date:'dd/MM/yyyy' }}</p>
    <p><strong>Location:</strong> {{ selectedEvent?.eventPlace }}</p>
    <p><strong>Created by:</strong> {{ selectedEvent?.createdBy }}</p>
  </div>
  <p class="description"><strong>Description :</strong> {{ selectedEvent?.eventDescription }}</p>

  <div class="grid">
    <div class="card">
      <h1 class="count">{{ participantCount }}</h1>
      <p class="count-label">No. of Participants</p>
      <button *ngIf="participantCount <= 0" (click)="addParticipant()" class="add-btn">
        <mat-icon fontIcon="add_circle_outline">add_circle_outline</mat-icon>
        Add Participants
      </button>
    </div>
    <!-- <div class="card">
      <button (click)="generateCert()"
        [ngClass]="participantCount.length <= 0 ? 'certificate-text-disabled' : 'certificate-text-enabled' ">
        <mat-icon fontIcon="add_circle_outline">add_circle_outline</mat-icon>
        Choose a Certificate
      </button>
    </div> -->

    <div class="d-none">{{selectedEvent?.selectedTemplate | json}}</div>
    <div class="card">
      <button *ngIf="!selectedEvent?.selectedTemplate" (click)="generateCert()" [disabled]="participantCount <= 0"
        [ngClass]="participantCount <= 0 ? 'certificate-text-disabled' : 'certificate-text-enabled' ">
        <mat-icon fontIcon="add_circle_outline">add_circle_outline</mat-icon>
        Choose a Certificate
      </button>

      <div *ngIf="selectedEvent?.selectedTemplate"
        [style.cursor]="isDownloading ? 'not-allowed' : 'pointer'"
        [style.opacity]="isDownloading ? '0.6' : '1'">
        <img [src]="selectedEvent.selectedTemplate.templateLogo" alt="Selected Certificate">
        <button type="button" class="certificate-text-enabled" [disabled]="isDownloading"
          (click)="!isDownloading && downloadCertificates()">
          <mat-spinner *ngIf="isDownloading" diameter="16" style="display:inline-block; margin-right:6px;"></mat-spinner>
          <mat-icon *ngIf="!isDownloading">download</mat-icon>
          {{ isDownloading ? 'Generating...' : 'Download Certificates' }}
        </button>
      </div>
    </div>
  </div>
</div>
