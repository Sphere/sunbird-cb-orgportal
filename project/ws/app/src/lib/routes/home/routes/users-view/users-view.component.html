<div class="users-page">

  <!-- Page title -->
  <div class="page-header">
    <h1 class="page-title">Users</h1>
  </div>

  <!-- Tab navigation -->
  <div class="users-tabs">
    <button class="tab-link" [ngClass]="{'tab-active': currentFilter === 'active'}"
      (click)="filter('active')">Active</button>
    <button class="tab-link" [ngClass]="{'tab-active': currentFilter === 'inactive'}"
      (click)="filter('inactive')">Inactive</button>
    <button class="tab-link" [ngClass]="{'tab-active': currentFilter === 'upload'}"
      (click)="filter('upload'); tabTelemetry('upload', 2)">File uploads</button>
  </div>

  <!-- Filter trigger row (hidden on File uploads tab) -->
  <div class="filter-row" *ngIf="currentFilter !== 'upload'">
    <button class="filter-trigger" type="button" (click)="filterTable()">
      <mat-icon class="material-icons-outlined">filter_alt</mat-icon>
      <span>Filter</span>
    </button>
  </div>

  <!-- Selected filter chips -->
  <ws-search-selected-filter *ngIf="currentFilter !== 'upload'" (filterChange)="filterChange($event)"
    [selectedFilters]="selectedFilters"></ws-search-selected-filter>

  <!-- Skeleton loading state for user table -->
  <ng-container *ngIf="isLoading && currentFilter !== 'upload'">
    <div class="table-skeleton">
      <div class="skeleton-toolbar">
        <div class="skeleton-search"></div>
        <div class="skeleton-btn"></div>
        <div class="skeleton-btn"></div>
      </div>
      <div class="skeleton-header-row">
        <div class="skeleton-cell sk-wide"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
      </div>
      <div class="skeleton-data-row" *ngFor="let i of [1,2,3,4,5,6,7]">
        <div class="skeleton-cell sk-wide"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
        <div class="skeleton-cell sk-narrow"></div>
      </div>
    </div>
  </ng-container>

  <!-- User table widget (handles search + Create new button internally) -->
  <ng-container *ngIf="!isLoading && currentFilter !== 'upload'">
    <ws-widget-org-user-table [tableData]="tabledata" [data]="dataForTable" isUpload=true isCreate=true
      (eOnButtonClick)="onCreateClick($event)" (eOnRowClick)="onRoleClick($event)" (actionsClick)="menuActions($event)">
    </ws-widget-org-user-table>
  </ng-container>

  <ng-container *ngIf="currentFilter === 'upload'">
    <ws-app-users-upload></ws-app-users-upload>
  </ng-container>

</div>
