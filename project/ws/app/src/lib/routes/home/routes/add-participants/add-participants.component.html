<div class="modal-container">
  <div class="modal-header">
    <h2 class="title">Add Participant</h2>
    <button mat-icon-button (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">

    <div class="upload-section">
      <p class="upload-description">Upload CSV file to add multiple participants</p>
      <button class="download-btn" (click)="downloadSampleExcel()">Download Sample Excel</button>
    </div>

    <div class="file-row">
      <label class="upload-btn">
        <input type="file" accept=".csv, .xlsx" (change)="onFileChange($event)">
        Upload File
      </label>
      <span class="file-hint">Only .csv, .xlsx file</span>
    </div>

    <div class="error-messages" *ngIf="validationErrors.length > 0">
      <p *ngFor="let error of validationErrors" class="error-text">{{ error }}</p>
    </div>

    <div class="success-message" *ngIf="isValidData && participants.length > 0">
      <p class="success-text">All data is valid. Ready to submit!</p>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button class="save-btn" [disabled]="!isValidData" (click)="saveParticipants()">Save & Add</button>
  </mat-dialog-actions>
</div>
