<div class="oe-dialog">
  <div class="oe-header">
    <div class="oe-header__left">
      <mat-icon class="oe-header__icon">{{ isEdit ? 'edit' : 'add_business' }}</mat-icon>
      <h2 class="oe-header__title">{{ isEdit ? 'Edit Organization' : 'Create Organization' }}</h2>
    </div>
    <button type="button" class="oe-close" (click)="onCancel()" aria-label="Close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="oe-body">
    <div class="oe-field">
      <label class="oe-label" for="orgName">Organization Name *</label>
      <input id="orgName" class="oe-input" type="text" [(ngModel)]="orgName" name="orgName"
        placeholder="Enter organization name" />
    </div>

    <div class="oe-field">
      <label class="oe-label" for="channel">Channel {{ isEdit ? '' : '*' }}</label>
      <input id="channel" class="oe-input" type="text" [(ngModel)]="channel" name="channel"
        placeholder="Enter channel" [readonly]="isEdit" [class.oe-input--readonly]="isEdit" />
      <span class="oe-hint" *ngIf="isEdit">Channel can't be changed after creation.</span>
    </div>

    <div class="oe-row">
      <div class="oe-field">
        <label class="oe-label" for="organisationType">Organisation Type</label>
        <input id="organisationType" class="oe-input" type="text" [(ngModel)]="organisationType"
          name="organisationType" placeholder="e.g. mdo" />
      </div>
      <div class="oe-field">
        <label class="oe-label" for="organisationSubType">Organisation Sub-type</label>
        <input id="organisationSubType" class="oe-input" type="text" [(ngModel)]="organisationSubType"
          name="organisationSubType" placeholder="e.g. department" />
      </div>
    </div>

    <label class="oe-checkbox" *ngIf="!isEdit">
      <input type="checkbox" [(ngModel)]="isTenant" name="isTenant" />
      <span>Is Tenant</span>
    </label>

    <div class="oe-error" *ngIf="error">
      <mat-icon>error_outline</mat-icon>
      <span>{{ error }}</span>
    </div>
  </div>

  <div class="oe-footer">
    <button type="button" class="oe-btn-secondary" (click)="onCancel()" [disabled]="saving">Cancel</button>
    <button type="button" class="oe-btn-primary" (click)="onSave()" [disabled]="!canSave">
      {{ saving ? 'Saving...' : (isEdit ? 'Update' : 'Create') }}
    </button>
  </div>
</div>
