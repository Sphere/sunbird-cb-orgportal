<div class="notifications-container">
  <section class="header-section">
    <h1 class="page-title">Notifications</h1>
    <p class="page-subtitle">Send notifications to learners about courses, competencies, programs and certificates.</p>
  </section>

  <section class="cards-grid">
    <mat-card *ngFor="let card of cards" class="action-card" [class.disabled]="!card.redirectLink"
      [attr.role]="card.redirectLink ? 'link' : null" [attr.tabindex]="card.redirectLink ? 0 : null"
      (click)="open(card)" (keydown.enter)="open(card)">
      <div class="card-header">
        <div class="card-icon"><mat-icon>{{ card.icon }}</mat-icon></div>
        <h3 class="card-title">{{ card.title }}</h3>
        <p class="card-description">{{ card.description }}</p>
      </div>
      <div class="card-actions">
        <button *ngIf="card.redirectLink" type="button" class="action-btn">Open</button>
        <span *ngIf="!card.redirectLink" class="coming-soon">Coming soon</span>
      </div>
    </mat-card>
  </section>
</div>
