<div class="select-competencies-container">
    <!-- Header -->
    <div class="header">
        <button type="button" class="back-nav-btn" (click)="onBack()">
            <mat-icon>arrow_back</mat-icon>
            <span>Back</span>
        </button>
        <div class="header-spacer"></div>
        <button class="next-btn" [disabled]="selection.selected.length === 0" (click)="onAssignCourses()">
            Assign courses
        </button>
    </div>

    <!-- Page Title -->
    <div class="page-title">
        <h1>Select Competencies</h1>
        <p class="subtitle">Choose which competencies learners will see on their home screen.</p>
    </div>

    <!-- Search -->
    <div class="search-container">
        <div class="custom-search-field">
            <input type="text" placeholder="Search by name, code" [value]="searchTerm()"
                (input)="searchTerm.set($any($event.target).value); onSearch()">
            <span class="search-icon">
                <svg width="21" height="21" viewBox="0 0 21 21" fill="none">
                    <circle cx="9" cy="9" r="7" stroke="#272727" stroke-width="2" />
                    <line x1="14" y1="14" x2="19" y2="19" stroke="#272727" stroke-width="2" stroke-linecap="round" />
                </svg>
            </span>
        </div>
    </div>

    <!-- Table (shimmer while loading, data after) -->
    <div class="table-container">
        <div class="table-scroll-wrapper">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th class="checkbox-col"></th>
                        <th class="code-col">Code</th>
                        <th class="name-col">Name</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Shimmer rows while loading -->
                    <ng-container *ngIf="loading()">
                        <tr *ngFor="let i of shimmerRows" class="shimmer-row">
                            <td class="checkbox-col"><div class="shimmer-box checkbox"></div></td>
                            <td class="code-col"><div class="shimmer-box text shimmer-short"></div></td>
                            <td class="name-col"><div class="shimmer-box text"></div></td>
                        </tr>
                    </ng-container>

                    <!-- Competency rows -->
                    <tr *ngFor="let row of filteredCompetencies()" [class.selected-row]="selection.isSelected(row)"
                        [class.preselected-row]="row.isPreselected">
                        <td class="checkbox-col">
                            <label class="custom-checkbox">
                                <input type="checkbox" (click)="$event.stopPropagation()"
                                    (change)="onSelectionChange(row, $event)" [checked]="selection.isSelected(row)"
                                    appDisableForViewOnly>
                                <span class="checkmark"></span>
                            </label>
                        </td>
                        <td class="code-col">{{ row.code }}</td>
                        <td class="name-col">{{ row.name }}</td>
                    </tr>
                </tbody>
            </table>

            <!-- Empty state -->
            <div *ngIf="!loading() && filteredCompetencies().length === 0" class="empty-state-overlay">
                <div class="empty-state-card">
                    <div class="empty-state-icon"><mat-icon>psychology</mat-icon></div>
                    <p class="empty-state-title">No competencies found</p>
                    <p class="empty-state-message">No competencies match your search or filter criteria.</p>
                </div>
            </div>
        </div>
    </div>
</div>
