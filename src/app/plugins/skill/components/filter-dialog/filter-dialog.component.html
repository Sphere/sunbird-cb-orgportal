<div class="filter-dialog-content">
  <form [formGroup]="filterForm" class="filter-form">

    <h2 class="dialog-title">Apply Filters</h2>

    <!-- Row 1: Role (always visible) + State / SubCenter / Designation (non-user only) -->
    <div class="filter-row">

      <div class="filter-field">
        <label for="filter-role" class="field-label">Select Role</label>
        <div class="select-wrapper">
          <select id="filter-role" class="select-input" formControlName="role">
            <option value="">All roles</option>
            <ng-container *ngFor="let role of rolesList">
              <option [value]="role.value">{{role.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field" *ngIf="!isUser">
        <label for="filter-state" class="field-label">Select State</label>
        <div class="select-wrapper">
          <select id="filter-state" class="select-input" formControlName="state"
            (change)="stateSelect(filterForm.value.state)">
            <option value="">All states</option>
            <ng-container *ngFor="let state of states">
              <option [value]="state.name">{{state.name}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field" *ngIf="!isUser">
        <label for="filter-subcenter" class="field-label">Select Sub Center</label>
        <div class="select-wrapper">
          <select id="filter-subcenter" class="select-input" formControlName="subCenter">
            <option value="">All sub centers</option>
            <ng-container *ngFor="let sc of subCentersList">
              <option [value]="sc.value">{{sc.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field" *ngIf="!isUser">
        <label for="filter-designation" class="field-label">Select Designation</label>
        <div class="select-wrapper">
          <select id="filter-designation" class="select-input" formControlName="designation">
            <option value="">All designations</option>
            <ng-container *ngFor="let d of designationsList">
              <option [value]="d.value">{{d.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

    </div>

    <!-- Row 2: City / Competency / Block / Activity (non-user only) -->
    <div class="filter-row" *ngIf="!isUser">

      <div class="filter-field">
        <label for="filter-city" class="field-label">Select City</label>
        <div class="select-wrapper">
          <select id="filter-city" class="select-input" formControlName="city">
            <option value="">All cities</option>
            <ng-container *ngFor="let city of disticts">
              <option [value]="city">{{city}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field">
        <label for="filter-competency" class="field-label">Select Competency</label>
        <div class="select-wrapper">
          <select id="filter-competency" class="select-input" formControlName="competency">
            <option value="">All competencies</option>
            <ng-container *ngFor="let c of competencysList">
              <option [value]="c.value">{{c.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field">
        <label for="filter-block" class="field-label">Select Block</label>
        <div class="select-wrapper">
          <select id="filter-block" class="select-input" formControlName="block">
            <option value="">All blocks</option>
            <ng-container *ngFor="let b of blocksList">
              <option [value]="b.value">{{b.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="filter-field">
        <label for="filter-activity" class="field-label">Activity</label>
        <div class="select-wrapper">
          <select id="filter-activity" class="select-input" formControlName="block">
            <option value="">All activities</option>
            <ng-container *ngFor="let a of activitsList">
              <option [value]="a.value">{{a.displayText}}</option>
            </ng-container>
          </select>
          <span class="select-chevron" aria-hidden="true">
            <svg width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1l5 5 5-5" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </span>
        </div>
      </div>

    </div>

    <!-- Row 3: Email + Phone Number -->
    <div class="filter-row">

      <div class="filter-field">
        <label for="filter-email" class="field-label">Email</label>
        <input id="filter-email" type="email" class="field-input" formControlName="emails"
          placeholder="Enter email here" />
      </div>

      <div class="filter-field">
        <label for="filter-phone" class="field-label">Phone Number</label>
        <input id="filter-phone" type="tel" class="field-input" formControlName="phoneNumber"
          placeholder="Enter phone number here" />
      </div>

    </div>

    <!-- Footer -->
    <div class="dialog-footer">
      <button type="button" class="apply-btn" (click)="submit()">Apply</button>
    </div>

  </form>
</div>
