<div class="flex flex-ai-center mb-5 flex-w-wrap" *ngIf="selectedFilters && selectedFilters.length > 0">
  <ng-container *ngFor="let filter of selectedFilters ">
    <div class="d-flex flex-ai-center pr-2">
      <span class="text-capitalize">{{filter.label}} :&nbsp;</span>
      <a class="filter label mt-8 mr-2 py-0 label-background">
        {{filter.item}}
        <button type="button" style="all: unset; display: contents; cursor: pointer;"
          (click)="changeFilter(filter.label)">
          <mat-icon class="close-icon">close</mat-icon>
        </button>
      </a>
    </div>
  </ng-container>
  <!-- <div class="d-flex flex-ai-center">
    <a class="editFilter">Edit Filters</a>
  </div> -->
</div>
