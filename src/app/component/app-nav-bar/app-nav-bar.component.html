<mat-toolbar [color]="primaryNavbarBackground?.color" [ngStyle]="primaryNavbarBackground?.styles"
  class="mat-elevation-z3 custom mobile">
  <div class="fix-ww" id="root-tool-bar" role="toolbar">
    <ng-container *ngIf="mode === 'top'">
      <a routerLink="/app/home" class="logo-dim" role="link" title="Home" i18n-aria-title i18n-aria-label>
        <img [src]="appIcon" alt="Application Logo" class="app-logo" />
      </a>

      <!-- <span class="spacer"></span> -->
      <ng-container *ngIf="primaryNavbarConfig?.mediumScreen">
        <ng-container [ngTemplateOutlet]="navbarSide" [ngTemplateOutletContext]="{ item: item }"
          *ngFor="let item of primaryNavbarConfig?.mediumScreen?.left">
        </ng-container>

        <!-- <ws-app-search-input-home placeHolder="Search" class="my-search flex-1" [ref]="'home'">
        </ws-app-search-input-home> -->
        <span class="spacer"></span>
        <div ngClass="search-small-logo">
          <ng-container [wsResolverWidget]="{
        'widgetType': 'actionButton',
        'widgetSubType': 'buttonFeature',
        'widgetData': {
          'toolTop': 'Search',
          'actionBtnId': 'feature_search',
          'config': {
            'type': 'mat-icon-button'
          }
        }
      }"></ng-container>
        </div>
        <!-- <button class="home-help" mat-icon-button id='helper' [matMenuTriggerFor]="helpMenu" *ngIf="!isHelpMenuRestricted"
        >
        <mat-icon>help_outline</mat-icon>
      </button> -->
        <!-- {{primaryNavbarConfig?.mediumScreen?.right | json}} -->
        <ng-container [ngTemplateOutlet]="navbarSide" [ngTemplateOutletContext]="{ item: item }"
          *ngFor="let item of primaryNavbarConfig?.mediumScreen?.right">
        </ng-container>
        <!-- <div class="mat-icon-button pipe-icon">
        |
      </div> -->
        <!-- <ng-container [wsResolverWidget]="btnAppsConfig"></ng-container> -->
      </ng-container>

    </ng-container>
    <div class="flex justify-between items-center w-full" *ngIf="mode === 'bottom'">
      <ng-container *ngIf="primaryNavbarConfig?.smallScreen">
        <ng-container [ngTemplateOutlet]="navbarSide" [ngTemplateOutletContext]="{ item: item }"
          *ngFor="let item of primaryNavbarConfig?.smallScreen?.left">
        </ng-container>
      </ng-container>
      <a role="button" matRipple class="flex items-center flex-col px-2 box-sizing-box" routerLink="/app/home" active
        routerLinkActive="ws-mat-accent-text">
        <ng-container *ngIf="!appBottomIcon">
          <mat-icon>home</mat-icon>

          <span [ngClass]="instanceVal === 'Ford' ? 'title font-sans' : 'mat-caption'">Home</span>
        </ng-container>
        <ng-container *ngIf="appBottomIcon">
          <img width="40px" height="40px" [src]="appBottomIcon" i18n-alt alt="Home" />
        </ng-container>
      </a>
      <ng-container *ngIf="primaryNavbarConfig?.smallScreen">
        <ng-container [ngTemplateOutlet]="navbarSide" [ngTemplateOutletContext]="{ item: item }"
          *ngFor="let item of primaryNavbarConfig?.smallScreen?.right">
        </ng-container>
      </ng-container>
      <ng-container [wsResolverWidget]="btnAppsConfig"></ng-container>
    </div>
  </div>
  <!-- <div class="fix-ww" *ngIf="mode === 'top'">
    <ng-container [wsResolverWidget]="{ 'widgetType': 'card',
      'widgetSubType': 'cardHomeHubs',
      widgetData: {}}">
    </ng-container>
  </div> -->
</mat-toolbar>

<ng-template #navbarSide let-item="item">
  <button mat-icon-button
          type="button"
          *ngIf="item.type === 'featureButton' && item.config.actionBtnId !== 'feature_notification'"
          [routerLink]="getFeatureUrl(item.config.actionBtnId)"
          [matTooltip]="item.config.toolTip"
          matTooltipPosition="below"
          routerLinkActive="ws-active-nav-icon"
          class="nav-icon-btn">
    <mat-icon>{{ getFeatureIcon(item.config.actionBtnId) }}</mat-icon>
  </button>
  <ng-container *ngIf="item.type === 'widgetButton' && item.config.widgetSubType === 'actionButtonProfile'">
    <button mat-icon-button type="button" [matMenuTriggerFor]="profileMenu" class="profile-avatar-btn" matTooltip="Profile" matTooltipPosition="below">
      <span class="profile-initials">{{ getUserInitials() }}</span>
    </button>
    <mat-menu #profileMenu="matMenu" xPosition="before" panelClass="ws-nav-profile-menu">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:#eef4fb;pointer-events:none;">
        <span style="width:34px;height:34px;min-width:34px;border-radius:50%;background:#1c5d95;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:0.5px;flex-shrink:0;">{{ getUserInitials() }}</span>
        <span style="font-size:14px;font-weight:600;color:#1c5d95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ configSvc.userProfile?.firstName }} {{ configSvc.userProfile?.lastName }}</span>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()" style="min-height:44px;">
        <mat-icon style="color:#ca0000;font-size:20px;width:20px;height:20px;line-height:20px;margin-right:6px;">logout</mat-icon>
        <span style="font-size:14px;color:#333;">Logout</span>
      </button>
    </mat-menu>
  </ng-container>
  <ng-container *ngIf="item.type === 'widgetButton' && item.config.widgetSubType !== 'actionButtonProfile'" [wsResolverWidget]="item.config"></ng-container>
</ng-template>

<mat-menu #helpMenu="matMenu">
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_aboutUs',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'channel_how_to',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_FAQs',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <ws-widget-btn-feature [widgetData]="{
      actionBtnId: 'feature_quickTour',
      config: {
        type: 'mat-menu-item'
      }
    }"></ws-widget-btn-feature>
  <div mat-menu-item *ngIf="isTourGuideAvailable" (click)="startTour()">
    <mat-icon>help</mat-icon>
    <span class="ml-2">Tour Guide</span>
  </div>

</mat-menu>
